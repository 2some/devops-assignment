apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-flask-app
  template:
    metadata:
      labels:
        app: devops-flask-app
    spec:
      containers:
        - name: devops-flask-app
          image: devops-flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
